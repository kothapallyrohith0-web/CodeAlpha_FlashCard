<!DOCTYPE html>
<html>

<head>
    <title>FLASH CARD QUIZ</title>
    <link rel="icon" type="image/png" href="images/cap2.png">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <nav class="navbar">
    <div class="logo">
        <img src="images/cap2.png" class="nav-icon">
        <span>Flash Card Quiz</span>
    </div>

    <div class="nav-links">
        <a href="#"><i class="fa-solid fa-house"></i> Home</a>
        <a href="#"><i class="fa-solid fa-book"></i> Flashcards</a>
        <a href="#"><i class="fa-solid fa-circle-info"></i> About</a>
        <button id="themeBtn" onclick="toggleTheme()" title="toggle theme">
    🌙
</button>
    </div>
</nav>

    <div class="card">

        <h1>
            <img src="images/cap2.png" class="cap">
            Flash Card Quiz
        </h1>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <h2 id="question"></h2>

        <button onclick="showAnswer()">
            <i class="fa-regular fa-eye"></i>
            Show Answer
        </button>

        <p id="answer"></p>

        <br>

        <button onclick="previousCard()">
            <i class="fa-solid fa-chevron-left"></i>
            Previous
        </button>

        <button onclick="nextCard()">
            Next
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <button onclick="restartQuiz();
        closePopup()">
            <i class="fa-solid fa-rotate-right"></i>
            Restart Quiz
        </button>

        <br><br>

        <button onclick="addFlashcard()">
            <i class="fa-solid fa-plus"></i>
            Add
        </button>

        <button onclick="editFlashcard()">
            <i class="fa-solid fa-pen"></i>
            Edit
        </button>

        <button onclick="deleteFlashcard()">
            <i class="fa-solid fa-trash"></i>
            Delete
        </button>

    </div>

    <div id="popup" class="popup">
        <div class="popup-box">

            <h2>
                <i class="fa-solid fa-circle-check"></i>
                Quiz Completed!
            </h2>

            <p>You have completed all flashcards.</p>

            <button onclick="restartQuiz()">
                <i class="fa-solid fa-rotate-right"></i>
                Restart Quiz
            </button>

            <button onclick="closePopup()">
                <i class="fa-solid fa-xmark"></i>
                Close
            </button>

        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
